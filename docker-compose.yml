    command: ["-f", "/app/etc/tag.yaml"]

  # ==================== MQ 消费者服务 ====================
  article-mq:
    image: thinktalk:latest
    container_name: thinktalk-article-mq
    restart: unless-stopped
    depends_on:
      builder:
