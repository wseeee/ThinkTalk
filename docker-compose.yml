    depends_on:
      builder:
        condition: service_completed_successfully
    ports:
      - "8890:8890"
    volumes:
      - ./application/qa/api/etc:/app/etc
    entrypoint: ["/app/qa-api"]
    command: ["-f", "/app/etc/qa-api.yaml"]

  # ==================== RPC 服务 ====================
