services:
  # ==================== 构建器（只跑一次，产出共享镜像） ====================
  builder:
    build:
      context: .
      dockerfile: Dockerfile
    image: thinktalk:latest
    container_name: thinktalk-builder
    command: ["echo", "all services built"]

  # ==================== API 服务 ====================
  applet-api:
    image: thinktalk:latest
    container_name: thinktalk-applet-api
    restart: unless-stopped
    depends_on:
      builder:
        condition: service_completed_successfully
    ports:
      - "8888:8888"
    volumes:
      - ./application/applet/etc:/app/etc
    entrypoint: ["/app/applet-api"]
    command: ["-f", "/app/etc/applet-api.yaml"]

  article-api:
    image: thinktalk:latest
    container_name: thinktalk-article-api
    restart: unless-stopped
    depends_on:
      builder:
        condition: service_completed_successfully
    ports:
      - "8889:80"
    volumes:
      - ./application/article/api/etc:/app/etc
    entrypoint: ["/app/article-api"]
    command: ["-f", "/app/etc/article-api.yaml"]

  chat-api:
    image: thinktalk:latest
    container_name: thinktalk-chat-api
    restart: unless-stopped
    depends_on:
      builder:
        condition: service_completed_successfully
    ports:
      - "8088:8087"
    volumes:
      - ./application/chat/api/etc:/app/etc
    entrypoint: ["/app/chat-api"]
    command: ["-f", "/app/etc/chat-api.yaml"]

  qa-api:
