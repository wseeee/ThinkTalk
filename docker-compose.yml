    restart: unless-stopped
    depends_on:
      builder:
        condition: service_completed_successfully
    ports:
      - "8087:8087"
      - "9107:9107"
    volumes:
      - ./application/chat/rpc/etc:/app/etc
    entrypoint: ["/app/chat-rpc"]
    command: ["-f", "/app/etc/chat.yaml"]

  concerned-rpc:
