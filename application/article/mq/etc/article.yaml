Name: mq
KqConsumerConf:
  Name: article-kq-consumer
  Brokers:
    - ${KAFKA_HOST}:${KAFKA_PORT}
  Group: group-like-count
  Topic: thinktalk_like_count
  Offset: last
  Consumers: 1
  Processors: 1
ArticleKqConsumerConf:
  Name: article-cache-kq-consumer
  Brokers:
    - ${KAFKA_HOST}:${KAFKA_PORT}
  Group: group-article-event
  Topic: thinktalk_article
  Offset: last
  Consumers: 1
  Processors: 1
Datasource: ${DB_USER}:${DB_PASS}@tcp(${DB_HOST}:${DB_PORT})/thinktalk_article?parseTime=true
BizRedis:
  Host: ${REDIS_HOST}:${REDIS_PORT}
  Pass: ${REDIS_PASS}
  Type: node
Es:
  Addresses:
    - http://localhost:9200/
  Username:
  Password:
Prometheus:
  Host: 0.0.0.0
  Port: 9101
  Path: /metrics
Telemetry:
  Endpoint: http://127.0.0.1:14268/api/traces
UserRPC:
  Etcd:
    Hosts:
      - ${ETCD_HOST}:${ETCD_PORT}
    Key: user.rpc
  NonBlock: true
