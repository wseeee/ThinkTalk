Name: article-api
Host: 0.0.0.0
Port: 80
Auth:
  AccessSecret: ${JWT_ACCESS_SECRET}
  AccessExpire: 604800
  RefreshSecret: ${JWT_REFRESH_SECRET}
  RefreshExpire: 2592000
  RefreshAfter: 604800

MinIO:
  Endpoint: ${MINIO_ENDPOINT}
  AccessKeyID: ${MINIO_ACCESS_KEY_ID}
  AccessKeySecret: ${MINIO_ACCESS_KEY_SECRET}
  BucketName: ${MINIO_BUCKET_NAME}
  Location: zh-east-1
  UseSSL: false

ArticleRPC:
  Etcd:
    Hosts:
      - ${ETCD_HOST}:${ETCD_PORT}
    Key: article.rpc
  NonBlock: true
UserRPC:
  Etcd:
    Hosts:
      - ${ETCD_HOST}:${ETCD_PORT}
    Key: user.rpc
  NonBlock: true