Name: follow.rpc
ListenOn: 0.0.0.0:8081
Etcd:
  Hosts:
  - ${ETCD_HOST}:${ETCD_PORT}
  Key: follow.rpc
DB:
  DataSource: "${DB_USER}:${DB_PASS}@tcp(${DB_HOST}:${DB_PORT})/thinktalk_follow?parseTime=true&loc=Local"
  MaxIdleConns: 10
  MaxOpenConns: 100
  ConnMaxLifetime: 3600
BizRedis:
  Host: ${REDIS_HOST}:${REDIS_PORT}
  Pass: ${REDIS_PASS}
  Type: node
Prometheus:
  Host: 0.0.0.0
  Port: 9101
  Path: /metrics
Telemetry:
  Endpoint: http://127.0.0.1:14268/api/traces