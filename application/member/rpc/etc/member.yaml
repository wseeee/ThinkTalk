Name: member.rpc
ListenOn: 0.0.0.0:8091
Etcd:
  Hosts:
    - ${ETCD_HOST}:${ETCD_PORT}
  Key: member.rpc

DB:
  DataSource: ${DB_USER}:${DB_PASS}@tcp(${DB_HOST}:${DB_PORT})/thinktalk_member?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai
  MaxOpenConns: 10
  MaxIdleConns: 100
  MaxLifetime: 3600

BizRedis:
  Host: ${REDIS_HOST}:${REDIS_PORT}
  Pass: ${REDIS_PASS}
  Type: node
