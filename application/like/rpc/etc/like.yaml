Name: like.rpc
ListenOn: 0.0.0.0:8082
Mode: test
Etcd:
  Hosts:
  - ${ETCD_HOST}:${ETCD_PORT}
  Key: like.rpc
KqPusherConf:
  Brokers:
    - ${KAFKA_HOST}:${KAFKA_PORT}
  Topic: thinktalk_like
Mysql:
  DataSource: ${DB_USER}:${DB_PASS}@tcp(${DB_HOST}:${DB_PORT})/thinktalk_like?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai
CacheRedis:
  - Host: ${REDIS_HOST}:${REDIS_PORT}
    Type: node
    Pass: ${REDIS_PASS}
