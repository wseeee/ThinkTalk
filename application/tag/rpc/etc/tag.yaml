Name: tag.rpc
ListenOn: 0.0.0.0:8084
Etcd:
  Hosts:
  - ${ETCD_HOST}:${ETCD_PORT}
  Key: tag.rpc
DB:
  DataSource: "${DB_USER}:${DB_PASS}@tcp(${DB_HOST}:${DB_PORT})/thinktalk_tag?parseTime=true&loc=Local"
  MaxIdleConns: 10
  MaxOpenConns: 100
  ConnMaxLifetime: 3600
BizRedis:
  Host: ${REDIS_HOST}:${REDIS_PORT}
  Pass: ${REDIS_PASS}
  Type: node
Prometheus:
  Host: 0.0.0.0
  Port: 9103
  Path: /metrics
Telemetry:
  Endpoint: http://127.0.0.1:14268/api/traces
