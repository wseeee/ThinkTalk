Name: mq
KqConsumerConf:
  Name: concerned-kq-consumer
  Brokers:
    - ${KAFKA_HOST}:${KAFKA_PORT}
  Group: group-thinktalk-concerned
  Topic: thinktalk_concerned
  Offset: last
  Consumers: 1
  Processors: 1
Mysql:
  DataSource: ${DB_USER}:${DB_PASS}@tcp(${DB_HOST}:${DB_PORT})/thinktalk_concerned?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai
CacheRedis:
    - Host: ${REDIS_HOST}:${REDIS_PORT}
      Type: node
      Pass: ${REDIS_PASS}
