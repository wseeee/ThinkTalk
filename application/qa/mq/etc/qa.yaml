Name: mq
KqConsumerConf:
  Name: qa-kq-consumer
  Brokers:
    - ${KAFKA_HOST}:${KAFKA_PORT}
  Group: group-thinktalk-qa
  Topic: thinktalk_qa
  Offset: last
  Consumers: 1
  Processors: 1
Mysql:
  DataSource: ${DB_USER}:${DB_PASS}@tcp(${DB_HOST}:${DB_PORT})/thinktalk_qa?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai
Es:
  Addresses:
    - http://localhost:9200/
  Username:
  Password:
CacheRedis:
    - Host: ${REDIS_HOST}:${REDIS_PORT}
      Type: node
      Pass: ${REDIS_PASS}
