version: '3'

services:
  # ==================== Redis ====================
  redis:
    image: redis:6.2-alpine
    container_name: thinktalk-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass dsw123456
    restart: always

  # ==================== Etcd ====================
  etcd:
    image: bitnami/etcd:3.5
    container_name: thinktalk-etcd
    ports:
      - "2379:2379"
      - "2380:2380"
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://127.0.0.1:2379
    restart: always

  # ==================== Zookeeper ====================
  zookeeper:
    image: bitnami/zookeeper:3.8
    container_name: thinktalk-zookeeper
    ports:
      - "2181:2181"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    restart: always

  # ==================== Kafka ====================
  kafka:
    image: bitnami/kafka:3.4
    container_name: thinktalk-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://127.0.0.1:9092
      - ALLOW_PLAINTEXT_LISTENER=yes
    depends_on:
      - zookeeper
    restart: always

  # ==================== MinIO ====================
  minio:
    image: minio/minio
    container_name: thinktalk-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=dsw123456
    command: server /data --console-address ":9001"
    restart: always
